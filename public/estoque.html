<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Saldo e movimentações de insumos.">
    <title>Estoque · OrderFlow</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/estoque.js"></script>
  </head>
  <body>
    <header class="topo">
      <a class="marca" href="/">OrderFlow</a>
      <nav aria-label="Principal">
        <a href="/">Pedidos</a>
        <a href="/estoque.html" aria-current="page">Estoque</a>
      </nav>
    </header>
    <div id="modo" class="modo" hidden></div>

    <main>
      <div class="barra">
        <h1>Estoque de insumos</h1>
        <button id="novo-insumo" class="btn primario" type="button" disabled>Novo insumo</button>
      </div>
      <div class="tabela-rolagem">
        <table id="insumos" aria-busy="true">
          <thead>
            <tr>
              <th scope="col">Insumo</th>
              <th scope="col" class="num">Saldo</th>
              <th scope="col" class="num">Mínimo</th>
              <th scope="col">Situação</th>
              <th scope="col"><span class="visualmente-oculto">Ações</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="insumos-vazio" class="vazio" hidden>Nenhum insumo cadastrado.</p>
    </main>

    <dialog id="dlg-insumo" aria-labelledby="dlg-insumo-titulo">
      <form id="form-insumo">
        <h2 id="dlg-insumo-titulo">Novo insumo</h2>
        <label>Nome
          <input name="nome" required maxlength="120" autocomplete="off">
        </label>
        <label>Unidade
          <select name="unidade" required>
            <option value="un">un (unidade)</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="l">l</option>
            <option value="ml">ml</option>
            <option value="m">m</option>
          </select>
        </label>
        <label>Estoque mínimo
          <input name="estoque_minimo" inputmode="decimal" pattern="\d{1,11}([.,]\d{1,3})?" placeholder="0">
        </label>
        <p id="insumo-erro" class="erro-form" role="alert" hidden></p>
        <div class="acoes">
          <button class="btn" type="button" data-fechar>Cancelar</button>
          <button class="btn primario" type="submit">Salvar</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-entrada" aria-labelledby="dlg-entrada-titulo">
      <form id="form-entrada">
        <h2 id="dlg-entrada-titulo">Entrada</h2>
        <label>Quantidade
          <input name="quantidade" required inputmode="decimal" pattern="\d{1,11}([.,]\d{1,3})?">
        </label>
        <label>Motivo
          <input name="motivo" required maxlength="200" value="Compra" autocomplete="off">
        </label>
        <p id="entrada-erro" class="erro-form" role="alert" hidden></p>
        <div class="acoes">
          <button class="btn" type="button" data-fechar>Cancelar</button>
          <button class="btn primario" type="submit">Registrar</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-extrato" aria-labelledby="dlg-extrato-titulo">
      <h2 id="dlg-extrato-titulo">Extrato</h2>
      <ul id="extrato-lista" class="extrato"></ul>
      <div class="acoes">
        <button id="extrato-mais" class="btn" type="button" hidden>Carregar mais</button>
        <button class="btn" type="button" data-fechar>Fechar</button>
      </div>
    </dialog>

    <div id="avisos" class="avisos"></div>
  </body>
</html>
