services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:?defina PGUSER no .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?defina PGPASSWORD no .env}
      POSTGRES_DB: ${PGDATABASE:?defina PGDATABASE no .env}
    ports:
      # 127.0.0.1: o banco não fica exposto à rede local
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executado uma única vez, quando o volume está vazio
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    # Consultas paralelas usam /dev/shm; o padrão do Docker é 64 MB
    shm_size: 256mb
    healthcheck:
      # TCP de propósito: na inicialização, o servidor temporário só atende por socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  api:
    build: ./backend
    restart: unless-stopped
    # Processo 1 mínimo que repassa sinais ao Node
    init: true
    environment:
      # Dentro da rede do Compose, o host é o nome do serviço
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:?defina PGUSER no .env}
      PGPASSWORD: ${PGPASSWORD:?defina PGPASSWORD no .env}
      PGDATABASE: ${PGDATABASE:?defina PGDATABASE no .env}
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
