services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:?defina PGUSER no .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?defina PGPASSWORD no .env}
      POSTGRES_DB: ${PGDATABASE:?defina PGDATABASE no .env}
    ports:
      # 127.0.0.1: o banco não fica exposto à rede local
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executado uma única vez, quando o volume está vazio
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    # Consultas paralelas usam /dev/shm; o padrão do Docker é 64 MB
    shm_size: 256mb
    healthcheck:
      # TCP de propósito: na inicialização, o servidor temporário só atende por socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
